name: _native-build

on:
  workflow_call:
    inputs:
      cli-package-filter:
        description: 'pnpm filter of the CLI package to build (build:native, smoke, package)'
        required: false
        type: string
        default: '@moonshot-ai/kimi-code'
      binary-name:
        description: 'Name of the native executable produced by the CLI package (notarization path)'
        required: false
        type: string
        default: 'kimi'
      artifact-base-name:
        description: 'Base name of the zip artifacts produced by package.mjs (apps/kimi-code/dist-native/artifacts/<base>-<target>.zip)'
        required: false
        type: string
        default: 'kimi-code'
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'kimi-code-native'
      checkout-ref:
        description: 'Git ref to check out before building (defaults to the triggering commit)'
        required: false
        type: string
        default: ''
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 3
      sign-macos:
        description: 'Whether to sign + notarize macOS builds (requires Apple secrets)'
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  native-bundle:
    name: Native bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025-vs2026
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # An explicit checkout-ref lets repair runs build the exact release
          # commit instead of the current main HEAD; callers that omit it
          # keep the upstream default (the triggering commit).
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup macOS keychain (release only)
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Generate built-in catalog (release artifacts)
        if: inputs.sign-macos
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/kimi-code/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build Kimi web assets
        # The SEA blob step embeds apps/kimi-code/dist-web. The bundle is
        # committed (synced from the code-app repo) — just verify it is in place.
        run: node apps/kimi-code/scripts/check-web-assets.mjs

      - name: Build native executable (release profile, macOS signed)
        if: runner.os == 'macOS' && inputs.sign-macos
        run: pnpm --filter ${{ inputs.cli-package-filter }} run build:native:release

      - name: Build native executable (local profile)
        if: '!(runner.os == ''macOS'' && inputs.sign-macos)'
        run: pnpm --filter ${{ inputs.cli-package-filter }} run build:native:sea

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-notarize
        with:
          binary-path: ${{ github.workspace }}/apps/kimi-code/dist-native/bin/${{ matrix.target }}/${{ inputs.binary-name }}
          notarization-key-p8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
          notarization-key-id: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          notarization-issuer-id: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && inputs.sign-macos
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Smoke test native executable
        run: pnpm --filter ${{ inputs.cli-package-filter }} run test:native:smoke

      - name: Package native artifact
        run: pnpm --filter ${{ inputs.cli-package-filter }} run package:native

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/kimi-code/dist-native/artifacts/${{ inputs.artifact-base-name }}-${{ matrix.target }}.zip
            apps/kimi-code/dist-native/artifacts/${{ inputs.artifact-base-name }}-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore
