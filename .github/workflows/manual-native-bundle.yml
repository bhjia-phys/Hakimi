name: Manual Native Bundle

on:
  workflow_dispatch:
    inputs:
      sign-macos:
        description: 'Sign + notarize macOS builds (requires Apple secrets configured)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_native-build.yml
    with:
      cli-package-filter: '@bhjia-phys/hakimi'
      binary-name: hakimi
      artifact-base-name: hakimi
      upload-artifact-prefix: hakimi-native
      sign-macos: ${{ inputs.sign-macos }}
      retention-days: 3
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
